schema_version: 1

context:
  version: "26.6.0"
  python_min: "3.11"

package:
  name: jupyter_host_file_picker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter_host_file_picker/jupyter_host_file_picker-${{ version }}.tar.gz
  sha256: 882d1506380608351c31f19e1e2d619e5ad2b69d1f73160cc0a1367c4aa512f7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-jupyter-builder >=0.5.0
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - anywidget >=0.9.21
    - ipykernel >=6.30.1

tests:
  - python:
      imports:
        - jupyter_host_file_picker
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: File picker widget for the host filesystem in Jupyter.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/jupyter-host-file-picker/
  repository: https://github.com/jl-wynen/Jupyter-Host-File-Picker
  documentation: https://github.com/jl-wynen/Jupyter-Host-File-Picker/blob/main/README.md

extra:
  recipe-maintainers:
    - jl-wynen
